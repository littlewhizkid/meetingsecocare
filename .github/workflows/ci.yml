name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + Unit/Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecocare
          POSTGRES_PASSWORD: ecocare
          POSTGRES_DB: ecocare_meetings
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecocare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ecocare:ecocare@localhost:5432/ecocare_meetings?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + DB integration tests
        run: npx vitest run

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecocare
          POSTGRES_PASSWORD: ecocare
          POSTGRES_DB: ecocare_meetings
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecocare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ecocare:ecocare@localhost:5432/ecocare_meetings?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret-for-testing-only
      E2E_NO_SERVER: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations + seed
        run: |
          npx prisma migrate deploy
          npx ts-node --compiler-options '{"module":"CommonJS"}' prisma/seed.ts
          PGPASSWORD=ecocare psql -h localhost -U ecocare -d ecocare_meetings -c "UPDATE \"User\" SET \"mustChangePassword\" = false;"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Production Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://ecocare:ecocare@localhost:5432/ci_build?schema=public
      NEXTAUTH_SECRET: ci-secret-for-build-only
      NEXTAUTH_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecocare
          POSTGRES_PASSWORD: ecocare
          POSTGRES_DB: ci_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecocare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build